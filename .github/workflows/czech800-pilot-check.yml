name: Czech800 local tool syntax and QA
on:
  push:
    branches:
      - feat/czech800-alignment-pilot
  pull_request:
    paths:
      - "alignment/tool/**"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python syntax validation
        run: python -m py_compile alignment/tool/czech800_tool.py alignment/tool/czech800_align.py
      - name: Install light test dependency only
        run: python -m pip install rapidfuzz
      - name: Unit tests (no source media or GPU required)
        run: python -m unittest discover -s alignment/tool/tests -v
